run:
  timeout: 5m
  modules-download-mode: readonly

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    check-shadowing: true
  staticcheck:
    go: "1.23"
  gofmt:
    simplify: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gofmt

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
